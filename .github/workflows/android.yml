name: Android CI

on:
  workflow_dispatch

permissions:
  contents: read

env:
  ANDROID_HOME: /home/runner/android
  ANDROID_SDK_ROOT: /home/runner/android

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android SDK and NDK
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y unzip wget

          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME"

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip

          # 关键：把 cmdline-tools 重命名为 latest
          mv cmdline-tools latest

          # 接受 license
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            --licenses

          # 安装 SDK / Build Tools / NDK
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.0.12077973"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        run: |
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "ndk.dir=${ANDROID_HOME}/ndk/27.0.12077973"
          } > local.properties

      - name: Build with Gradle
        run: |
          ./gradlew assembleNonRootRelease --stacktrace

      - name: Show APK outputs
        run: |
          find app/build/outputs/apk -type f -name "*.apk" || true

      - name: Create temporary keystore if missing
        run: |
          if [ ! -f my-release-key.keystore ]; then
            keytool -genkeypair -v \
              -keystore my-release-key.keystore \
              -alias temp_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass password \
              -keypass password \
              -dname "CN=CI, OU=CI, O=CI, L=CI, ST=CI, C=US"
          fi

      - name: Sign APK
        run: |
          DATE_TIME=$(date +%y%m%d_%H%M%S)

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks my-release-key.keystore \
            --ks-key-alias temp_key \
            --ks-pass pass:password \
            --key-pass pass:password \
            --out "moonlight-android-millionhere_${DATE_TIME}.apk" \
            app/build/outputs/apk/nonRoot/release/app-nonRoot-release-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight APK
          path: moonlight-android-millionhere_*.apk
